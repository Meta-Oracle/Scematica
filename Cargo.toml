[workspace]
members = [
    "crates/scematica-core",
    "crates/scematica-sniper",
    "crates/scematica-arb",
    "crates/scematica-executor",
    "crates/scematica-dashboard",
    "crates/scematica-ai",
    "tools/key-converter",
    "tools/pool-seeder",
]
# The on-chain program uses Anchor and must be built separately with `anchor build`
exclude = [
    "programs/scematica-swap",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Scematica Team"]
license = "MIT"

[workspace.dependencies]
# Solana
solana-sdk = "1.18"
solana-client = "1.18"
solana-program = "1.18"
anchor-lang = "0.29"
anchor-spl = "0.29"
anchor-client = "0.29"
spl-token = { version = "4.0", features = ["no-entrypoint"] }
spl-associated-token-account = { version = "2.3", features = ["no-entrypoint"] }

# Async runtime
tokio = { version = "1.36", features = ["full"] }
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
borsh = "0.10"
bincode = "1.3"
toml = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Numerics
rust_decimal = { version = "1.34", features = ["serde-with-str"] }
num-traits = "0.2"

# Networking
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
url = "2.5"

# Config
config = "0.14"
dotenv = "0.15"

# CLI / TUI
clap = { version = "4.5", features = ["derive"] }
ratatui = "0.26"
crossterm = "0.27"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.7", features = ["v4", "serde"] }
dashmap = "5.5"
parking_lot = "0.12"
base64 = "0.21"
bs58 = "0.5"
hex = "0.4"
async-trait = "0.1"
shellexpand = "3.1"
