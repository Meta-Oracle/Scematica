[workspace]
members = [
    "crates/scematica-core",
    "crates/scematica-sniper",
    "crates/scematica-arb",
    "crates/scematica-executor",
    "crates/scematica-dashboard",
    "crates/scematica-api",
    "crates/scematica-ai",
    "crates/scematica-nn",
    "crates/scematica-protocol",
    "crates/scemadex-sdk",
    "crates/scemadex-settle",
    "crates/scemadex-integrations",
    "crates/scemadex-relay",
    "crates/scemadex-mcp",
    "crates/sdk-dashboard",
    "crates/scematica-suite",
    "tools/key-converter",
    "tools/pool-seeder",
    "agent-playground",
    "crates/scematica-sentience",
]
# The on-chain programs use Anchor and must be built separately with `anchor build`
exclude = [
    "programs/scematica-swap",
    "programs/scemadex-escrow",
    "programs/scemadex-vault",
    # The BOT Chain port. Its own workspace, and it must stay that way: an EVM stack
    # needs reqwest 0.12 / rustls 0.23, which is precisely the combination the pin
    # comments below say cannot coexist with solana-sdk's curve25519-dalek 3. One
    # lockfile for both trees resurrects that conflict; two lockfiles make it a
    # non-issue. See scema-botchain/README.md.
    "scema-botchain",
    # The BOT Chain neural mesh. Own workspace for the same lockfile reason, plus a
    # second one: its inference path is a spec others reimplement, so it is kept
    # dependency-minimal on purpose. See scema-bot-mesh/README.md.
    "scema-bot-mesh",
]
resolver = "2"

[workspace.package]
version = "1.25.0"
edition = "2021"
authors = ["Scematica Team"]
license = "MIT"

[workspace.dependencies]
# Solana â€” pinned to 1.18.x; upgrading to 2.x+ requires code changes across the board
# and creates irreconcilable zeroize version conflicts with reqwest â‰¥0.12 / rustls â‰¥0.22.
solana-sdk = "1.18.26"
solana-client = "1.18.26"
solana-program = "1.18.26"
solana-account-decoder = "1.18.26"
solana-transaction-status = "1.18.26"
# anchor-lang is in workspace for reference but excluded programs use it; no crate imports it
anchor-lang = "0.30.1"
anchor-spl = "0.30.1"
anchor-client = "0.30.1"
spl-token = { version = "4.0", features = ["no-entrypoint"] }
spl-associated-token-account = { version = "3.0.4", features = ["no-entrypoint"] }

# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
borsh = "0.10"
bincode = "1.3"
toml = "0.8"
sha2 = "0.10"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"

# Error handling
anyhow = "1"
thiserror = "1"

# Numerics
rust_decimal = { version = "1", features = ["serde-with-str"] }
num-traits = "0.2"

# Networking
# reqwest must stay at 0.11: 0.12 pulls rustls 0.23 which requires zeroize â‰¥1.7,
# conflicting with curve25519-dalek 3 (used by solana-sdk's ed25519-dalek) which caps at <1.4.
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
# tokio-tungstenite 0.21 matches the tungstenite version compatible with solana-sdk's deps
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
url = "2"

# Config
config = "0.14"
dotenv = "0.15"

# CLI / TUI
clap = { version = "4", features = ["derive"] }
ratatui = "0.26"
crossterm = "0.27"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
dashmap = "5"
parking_lot = "0.12"
# base64 0.21 still exposes legacy decode/encode functions used in jupiter.rs and sniper executor;
# 0.22 removes them â€” would require code changes.
base64 = "0.21"
bs58 = "0.5"
hex = "0.4"
rand = "0.8"
async-trait = "0.1"
shellexpand = "3"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
panic = "abort"
