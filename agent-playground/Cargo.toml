[package]
name = "scema-agent-playground"
version = "0.1.1"
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "A terminal arena where multiple LLM agents converse, debate, and collaborate — with free/local backends (Ollama, Groq, OpenRouter, LM Studio, Cerebras)."
keywords = ["llm", "agents", "tui", "ai", "chatbot"]
categories = ["command-line-utilities", "visualization"]
readme = "README.md"
repository = "https://github.com/Meta-Oracle/Scematica"
homepage = "https://github.com/Meta-Oracle/Scematica"

[[bin]]
name = "playground"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
clap = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
toml = { workspace = true }
