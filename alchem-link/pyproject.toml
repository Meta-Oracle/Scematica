[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alchem-link"
version = "0.4.0"
description = "Alchemy x Chainlink developer toolkit — oracle consumer-safety auditing, measured feed cadence, cross-chain divergence, and batched chain reads with zero dependencies"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
# No runtime dependencies. The library and CLI are standard library only — including
# Keccak-256, which is implemented in-package because hashlib ships SHA3-256 and the
# padding differs. Only the TUI needs anything, and it is an extra.
dependencies = []
authors = [{ name = "meta-oracle" }]
keywords = ["alchemy", "chainlink", "web3", "oracle", "rpc", "defi", "ethereum", "price-feed", "keccak", "multicall", "security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Office/Business :: Financial",
    "Topic :: Security",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
tui = ["textual>=0.61.0"]

[project.urls]
Homepage = "https://github.com/Meta-Oracle/Scematica"
Repository = "https://github.com/Meta-Oracle/Scematica"
Issues = "https://github.com/Meta-Oracle/Scematica/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
alchem-link = "alchem_link.cli:main"
alchem-link-ui = "alchem_link.ui:launch"
alchem-nn = "alchem_nn.cli:main"

[tool.pytest.ini_options]
addopts = "-p no:anchorpy"
