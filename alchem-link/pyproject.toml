[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alchem-link"
version = "0.1.0"
description = "Alchemy x Chainlink developer package scaffold"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "meta-oracle" }]
keywords = ["alchemy", "chainlink", "web3", "solana", "oracle", "rpc", "defi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Office/Business :: Financial",
]

[project.urls]
Homepage = "https://github.com/Meta-Oracle/Scematica"
Repository = "https://github.com/Meta-Oracle/Scematica"
Issues = "https://github.com/Meta-Oracle/Scematica/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
alchem-link = "alchem_link.cli:main"

[tool.pytest.ini_options]
addopts = "-p no:anchorpy"
