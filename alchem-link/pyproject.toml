[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alchem-link"
version = "0.23.24"
description = "Alchemy x Chainlink developer toolkit — oracle consumer-safety auditing, guard simulation, measured feed cadence, cross-chain divergence, and a full terminal UI, with zero dependencies"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
# No runtime dependencies, and as of 0.23.0 no optional ones either. The library, the
# CLI and the full-screen dashboard are standard library only — including Keccak-256,
# which is implemented in-package because hashlib ships SHA3-256 and the padding differs,
# and including the terminal system itself (alchem_link.term): screen diffing, colour
# depth negotiation, input parsing and the event loop. The user interface used to be the
# one place the zero-dependency claim was quietly abandoned; it is not any more.
dependencies = []
authors = [{ name = "meta-oracle" }]
keywords = ["alchemy", "chainlink", "web3", "oracle", "rpc", "defi", "ethereum", "price-feed", "keccak", "multicall", "security", "tui", "terminal", "prometheus", "simulation"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Office/Business :: Financial",
    "Topic :: Security",
    "Topic :: Terminals",
    "Environment :: Console",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/Meta-Oracle/Scematica"
Repository = "https://github.com/Meta-Oracle/Scematica"
Issues = "https://github.com/Meta-Oracle/Scematica/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
alchem-link = "alchem_link.cli:main"
alchem-link-ui = "alchem_link.dashboard:launch"
alchem-nn = "alchem_nn.cli:main"
sentience = "sentience.cli:main"

[tool.pytest.ini_options]
addopts = "-p no:anchorpy"
