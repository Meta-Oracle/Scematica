# Fibonacci Recovery Configuration
# Optimized for maximum PnL based on live trade data analysis
# 
# Key Changes from Default:
# - Fibonacci entry gating (min_entry_score = 0.75)
# - Dead pool fast exit (3s timeout)
# - Fibonacci TP levels (61.8%, 161.8%, 261.8%)
# - Position sizing by Fibonacci score
# - Pool size restricted to Fibonacci sweet spot (8-21 SOL)

[rpc]
endpoint = "https://mainnet.helius-rpc.com/?api-key=b1d54eff-a0db-4e72-84da-61def55d5d55"
ws_endpoint = "wss://mainnet.helius-rpc.com/?api-key=b1d54eff-a0db-4e72-84da-61def55d5d55"
commitment = "confirmed"

[wallet]
keypair_path = "C:\\Users\\deads\\.config\\solana\\id.json"

[sniper]
enabled = true
quote_mint = "WSOL"

# ═══════════════════════════════════════════════════════════════════════════
# FIBONACCI POSITION SIZING
# ═══════════════════════════════════════════════════════════════════════════
# Base size reduced - Fibonacci system will scale up for high-quality pools:
# - Score 0.75-0.80: 1.0× (0.005 SOL)
# - Score 0.80-0.90: 1.618× (0.008 SOL) 
# - Score 0.90+: 2.0× (0.010 SOL)
# After 3 consecutive wins: 2.0× multiplier
# After 5 consecutive wins: 5.0× multiplier
quote_amount = 0.005

# ═══════════════════════════════════════════════════════════════════════════
# FIBONACCI EXIT SYSTEM
# ═══════════════════════════════════════════════════════════════════════════
# Traditional TP/SL disabled - Fibonacci momentum system handles all exits:
# - Dead pool exit: 3s timeout if peak < 5%
# - Fibonacci TP levels: 61.8%, 161.8%, 261.8%
# - Golden retracement: 61.8% pullback from peak
# - Velocity collapse: momentum dying at 50% retracement
take_profit_pct = 999999.0  # Disabled - Fibonacci handles TP
stop_loss_pct = 999999.0    # Disabled - Fibonacci handles SL

# Dead pool detection (CRITICAL for loss prevention)
# Live data: 90% of losses are dead pools that never pump
# Exit at 3s if peak gain < 5% (above AMM spread)
no_pump_timeout_secs = 3
no_pump_min_gain_pct = 5.0

# Slippage
buy_slippage_pct = 1.0
sell_slippage_pct = 2.5

# ═══════════════════════════════════════════════════════════════════════════
# FIBONACCI POOL SCORING
# ═══════════════════════════════════════════════════════════════════════════
# Raised to 75 - Fibonacci entry gate is primary filter
# Only pools with score ≥75 pass (golden ratio patterns confirmed)
min_pool_score = 75

# ═══════════════════════════════════════════════════════════════════════════
# POSITION MANAGEMENT
# ═══════════════════════════════════════════════════════════════════════════
# Monitor settings
price_check_interval_ms = 250
price_check_duration_ms = 60000  # 60s max hold

# Concurrency
max_concurrent_positions = 3  # Conservative - focus on quality
max_buys = 0  # Unlimited - Fibonacci gate controls entry rate

# Retries
max_buy_retries = 3
max_sell_retries = 3

# ═══════════════════════════════════════════════════════════════════════════
# RISK MANAGEMENT
# ═══════════════════════════════════════════════════════════════════════════
# Keep existing safety limits
daily_loss_limit_sol = 0.05
max_drawdown_pct = 50.0
min_sol_reserve = 0.02

# Session heat (disabled - Fibonacci dead-pool exit prevents cascading losses)
session_heat_losses = 0
session_heat_window_secs = 3600
session_heat_cooldown_mins = 15

# ═══════════════════════════════════════════════════════════════════════════
# FIBONACCI POOL FILTERS
# ═══════════════════════════════════════════════════════════════════════════
[sniper.filters]
# Pool size: Fibonacci sweet spot (F(6) to F(8))
# Live data: Winners are 8-21 SOL, losers are <8 or >50 SOL
min_pool_size = 8.0   # Fibonacci F(6)
max_pool_size = 21.0  # Fibonacci F(8)

# Core safety filters (keep enabled)
check_mint_renounced = false  # Pump.fun pools often not renounced at detection
check_freezable = true
check_burned = true
check_mutable = true

# Deployer age (disabled - Fibonacci velocity/pressure signals are better)
check_deployer_wallet_age = false
deployer_min_age_hours = 0

# Price impact
check_liquidity_depth = true
max_price_impact_pct = 3.5

# Holder concentration (disabled - too many false positives on fresh pools)
check_holder_concentration = false
max_top10_holder_pct = 95.0

# Social links (disabled - Fibonacci momentum is primary signal)
check_socials = false

# Name check (disabled - too many false positives)
check_name = false

# Volume check (disabled - Fibonacci velocity replaces this)
check_volume = false
min_volume_txns = 3

# Cross-pool correlation (disabled - adds latency)
check_cross_pool_correlation = false

# Liquidity momentum (disabled - Fibonacci buy pressure replaces this)
check_liquidity_momentum = false

# Deployer rug history (keep enabled)
max_deployer_rugs_24h = 2

# Filter cache
filter_cache_ttl_secs = 30

# ═══════════════════════════════════════════════════════════════════════════
# KELLY SIZING (Disabled - Fibonacci sizing is better)
# ═══════════════════════════════════════════════════════════════════════════
kelly_sizing = false
kelly_fraction = 0.25
kelly_lookback = 20
kelly_min_trades = 10

# ═══════════════════════════════════════════════════════════════════════════
# PROFIT-FIRST MODE (Disabled - Fibonacci compounding is better)
# ═══════════════════════════════════════════════════════════════════════════
profit_first_mode = false
profit_first_floor_pct = 25.0
wallet_target_sol = 0.15

# ═══════════════════════════════════════════════════════════════════════════
# MOMENTUM HOLD (Disabled - Fibonacci momentum system replaces this)
# ═══════════════════════════════════════════════════════════════════════════
momentum_hold = false
momentum_max_escalations = 7
momentum_escalation_factor = 1.8
momentum_pullback_exit_pct = 8.0
momentum_min_peak_pct = 60.0
momentum_escalation_threshold_pct = 3.0

# ═══════════════════════════════════════════════════════════════════════════
# LEGACY EXIT SIGNALS (All disabled - Fibonacci system handles exits)
# ═══════════════════════════════════════════════════════════════════════════
momentum_min_peak_pct = 999999.0
velocity_decay_min_pnl_pct = 999999.0
volume_exhaustion_pct = 0.0
whale_exit_vault_drop_pct = 0.0
flash_crash_pct = 0.0
profit_lock_checks = 0

# Trailing stop (disabled - Fibonacci golden retracement replaces this)
trailing_stop_loss_pct = 999999.0

# Partial TP (disabled - Fibonacci tiered levels replace this)
partial_tp_pct = 0.0
partial_tp_trigger = 0.0
tiered_partial_tp_levels = []

# ═══════════════════════════════════════════════════════════════════════════
# POOL QUALITY SIZING (Disabled - Fibonacci sizing is better)
# ═══════════════════════════════════════════════════════════════════════════
pool_quality_sizing = false
confirmation_window_ms = 0
check_interval_acceleration = false

# ═══════════════════════════════════════════════════════════════════════════
# RISK BREAKERS (Keep disabled - Fibonacci dead-pool exit is sufficient)
# ═══════════════════════════════════════════════════════════════════════════
ath_drawdown_pct = 0.0
grief_loss_window_secs = 300
grief_loss_limit_sol = 0.0

# ═══════════════════════════════════════════════════════════════════════════
# MULTI-RPC FAILOVER
# ═══════════════════════════════════════════════════════════════════════════
extra_rpc_endpoints = []

# ═══════════════════════════════════════════════════════════════════════════
# BLACKLIST
# ═══════════════════════════════════════════════════════════════════════════
blacklist_path = "blacklist.txt"

# ═══════════════════════════════════════════════════════════════════════════
# ARBITRAGE (Keep disabled - focus on sniper recovery)
# ═══════════════════════════════════════════════════════════════════════════
[arb]
enabled = false
start_mint = "WSOL"
start_amount = 0.005
min_profit_lamports = 10000
max_hops = 3

# ═══════════════════════════════════════════════════════════════════════════
# EXECUTION
# ═══════════════════════════════════════════════════════════════════════════
[execution]
compute_unit_limit = 400000
compute_unit_price = 200000
skip_preflight = true

