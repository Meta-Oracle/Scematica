# ===========0=================================================
# Sniper Configuration
# ============================================================
[sniper]
enabled = true
quote_mint = "WSOL"       # WSOL or USDC
quote_amount = 0.01       # Base amount per snipe (in SOL) — scaled by rate mode multiplier
buy_delay_ms = 0
max_buy_retries = 3
max_sell_retries = 3       # 3 retries max — more wastes time in drained pools
auto_sell = true
auto_sell_delay_ms = 0
take_profit_pct = 175.0   # Baseline TP (Balanced mode starting point); momentum escalator rides from here
stop_loss_pct = 10.0      # Tighter SL — exit before pool drains further
buy_slippage_pct = 1.0
sell_slippage_pct = 5.0   # Start at 5% — lands first attempt, avoids 2.5%→fail→5%→fail→min_out=0 chain
price_check_interval_ms = 250    # 4× faster polling to catch momentum peaks
price_check_duration_ms = 1800000 # 30 min monitor window — hold runners long enough for 1000x escalation to reach 1125x
one_token_at_a_time = true
use_snipe_list = false
snipe_list_path = "snipe-list.txt"
max_buys = 10              # Auto-activate sell mode after 10 successful buys; 0 = unlimited
trailing_stop_loss_pct = 20.0  # Tightened 25→20: locks profit faster when a parabolic pump reverses, so a chased runner gives back less from its peak. Still enough room for normal volatility.
partial_tp_pct = 0.0           # Disabled — single full exit at take_profit_pct
partial_tp_trigger = 0.0       # Disabled — no partial sells below the 0.05 SOL target

# ── v1.6.0 Exit Gate — Guaranteed ≥0.05 SOL Exits ───────────────────────────
# All momentum/timing exits are gated behind take_profit_pct (500%).
# Once position hits TP, profit floor locks at that level permanently.
momentum_min_peak_pct = 200.0       # Arm pullback exit at 200%+ peak (ensures peak-25>175 so exit_gate_met is satisfiable)
velocity_decay_min_pnl_pct = 100.0  # Arm decay exit at 100%+ gain — catches bleeders before they fall from 175% to 99%
volume_exhaustion_pct = 0.0         # Disabled — swell-based exit gate handles vault drain
whale_exit_vault_drop_pct = 0.0     # Disabled in profit zone
flash_crash_pct = 0.0               # Disabled in profit zone; SL handles crashes
profit_lock_checks = 0              # Disabled — profit floor in code locks 0.05 SOL

# ── v1.6.0 Momentum Escalation (Hold Longer) ──────────────────────────────────
momentum_hold = true
momentum_max_escalations = 6        # Fallback cap (was 12/~1125x). 6-round ladder: 175→315→567→1021→1837→3307% (~33x) — big-runner room without the fantasy chase that traps post-pump entries.
momentum_escalation_factor = 1.8    # TP grows 1.8× per round
momentum_escalation_threshold_pct = 8.0  # Only escalate the TP target on GENUINE sustained velocity (8%/check). At 5% it escalated on post-pump chop → kept raising the target instead of taking profit → trapped. 8% lets real runners escalate but a stalling pump takes the base TP.
momentum_pullback_exit_pct = 15.0   # At peak 200%: 15% pullback fires at 185%, above 175% floor → satisfiable
adaptive_pullback = false            # Disabled: adaptive formula makes pullback unreachable at 175-250% peak
max_concurrent_positions = 1   # 1 at a time — prevents RPC overload causing sell timeouts on multiple open positions
cooldown_after_losses = 0      # No pause after losses — keep recycling capital
cooldown_minutes = 20          # Cooldown duration in minutes
daily_loss_limit_sol = 0.05    # Halt if daily losses exceed 0.05 SOL
max_drawdown_pct = 20.0       # Halt if wallet drops 20% below session start — tighter than 50% to preserve capital
blacklist_path = "blacklist.txt"

# ── v1.7.0 Pool Quality Gate ───────────────────────────────────────────────────
# Bayesian pool scorer (pool_scorer.rs). DexScreener-boosted tokens bypass this gate entirely.
# After velocity fix: open_time=0 pools no longer get 0.35 dead-pool penalty.
# Score 50 = unknown/stale pool, small size, no signals.
# Score 80 = fresh detection + 15-20 SOL + no buy pressure (baseline runner candidate).
# Score 92+ = fresh + 20-45 SOL + buy pressure confirmed OR pumpfun signal.
min_pool_score = 65              # Balanced (was 92 = elite-only). 92 only passed pools still visibly pumping = parabolic tops; 65 catches quality pools earlier in the curve. Validated-profitable value.
# false = the live-inflow check is ADVISORY: the measured rate still feeds the pool
# scorer as a bonus, but a flat vault reading no longer vetoes the buy.
# true  = the check may VETO, for operators who want confirmation-only entries.
#
# This flag did not actually work until 2026-08-05. Setting it false only relaxed the
# pass condition; the reject path fired regardless, and was the single largest source
# of rejections in the decision log (1,643 pools at inflow_rate=0.000, including pools
# scoring 99.9). The check samples vault growth over a fraction of a second, so it
# cannot tell "nobody is buying" from "no buy landed in my window" — live inflow was
# measurable for only 9.2% of observations. It is not sound enough to veto on.
require_moonshot_confirmation = false
moonshot_min_score = 92.0
moonshot_min_inflow_sol_per_sec = 0.5
moonshot_min_growth_pct = 1.0
moonshot_min_growth_sol = 0.01
moonshot_min_pumpfun_score = 90.0
moonshot_min_historical_velocity_sol_per_sec = 2.618
elite_pool_mode = false                   # Disabled: requires live_inflow or pregrad — neither fires for Raydium-listener pools
elite_min_score = 92.0
elite_min_signal_count = 2
elite_min_pool_size_sol = 20.0
elite_max_pool_size_sol = 150.0
elite_max_age_secs = 30
elite_min_inflow_sol_per_sec = 0.5
elite_min_pumpfun_score = 90.0
elite_min_historical_velocity_sol_per_sec = 2.618
elite_min_buy_pressure_ratio = 0.0001
elite_require_live_or_pregrad = true

# ── v1.1.0 Kelly Position Sizing ────────────────────────────────────────────────
kelly_sizing = false
kelly_fraction = 0.25
kelly_lookback = 20
kelly_min_trades = 10               # Trades required before Kelly activates

# ── v1.1.0 Session Heat Cooldown ────────────────────────────────────────────────
session_heat_losses = 3             # Live tail hit 5-loss heat after avoidable churn; pause earlier.
session_heat_window_secs = 1800     # 30-min rolling window — faster reaction than 1h
session_heat_cooldown_mins = 15     # Pause duration when heat trips

# ── v1.9.0 Time-of-Day Controls ─────────────────────────────────────────────────
# Calibrated from 573 confirmed trades (2026-05-16 to 2026-05-23):
#   0% WR hours (UTC): 01:00, 21:00 → hard-blocked
#   53% WR: 03:00 | 52% WR: 16:00 | 50% WR: 10:00 (best trading windows)
# ── v1.10.0 Pump.fun Trending Monitor ───────────────────────────────────────────
# Connects to PumpPortal WebSocket (wss://pumpportal.fun/api/data) for real-time
# bonding-curve trade events. Tracks buy/sell velocity per token.
# Trending score = buy_pressure(40pts) + volume_velocity(30pts) + curve_fill(30pts)
# When a trending token graduates to Raydium, it's emitted to the sniper pipeline
# 0.5–3s ahead of the standard Raydium AMM V4 listener.
pumpfun_trending_enabled = true     # Enable PumpPortal WebSocket trending monitor
pumpfun_trending_score = 80.0       # Min score to consider a token "trending" (0-100). Elite mode requires stronger pre-grad momentum.
pumpfun_min_curve_pct = 75.0        # Min bonding curve fill %. Prefer tokens close to migration with active demand.
pumpfun_window_secs = 120           # Sliding window for trend calculation (seconds)
pumpfun_max_migration_age_secs = 90 # Skip stale graduations in the early PumpPortal path; Raydium listener can still evaluate them
pumpfun_min_recent_buys = 5         # Require real buy activity before treating a migration as a runner
pumpfun_min_net_buy_sol = 0.75      # Buy volume minus sell volume in the trend window
pumpfun_max_last_buy_age_secs = 12  # Last buy must be recent at graduation time

# ── v1.9.0 Time-of-Day Controls ─────────────────────────────────────────────────
# Calibrated from 573 confirmed trades (2026-05-16 to 2026-05-23):
#   0% WR hours (UTC): 01:00, 21:00 → hard-blocked
#   53% WR: 03:00 | 52% WR: 16:00 | 50% WR: 10:00 (best trading windows)
time_of_day_weighting = true        # Scale buy size by hour quality (1.3× peak, 0.5× dead)
blocked_hours_utc = [1, 5]         # Full-dataset analysis (685 trades): only 01h (-0.0015) and 05h (-0.0306) are net negative. 09h is +0.087 and 18h is +0.317 SOL (2nd-best hour!) — the old blocks came from a small recent-tail sample and were costing real money. Prefer full-data estimates over recent tails.
weekend_mode = "Bearish"            # RE-ENABLED with the transition-only fix: the watcher no longer writes on startup (manual mode selection persists across sessions); it only switches when the Sat/Sun boundary is crossed while running. Data (685 trades): Sunday is NET NEGATIVE (-0.109 SOL, 12.5% WR) — Bearish sizing on weekends is worth real money.
weekday_mode = "Balanced"           # Restored Mon-Fri after a weekend transition (Mon+Tue = 96% of all profit in the data).

# ── v1.1.0 Buy Improvements ─────────────────────────────────────────────────────
min_sol_reserve = 0.02              # Keep at least this SOL in wallet after buy
confirmation_window_ms = 200        # 200ms pause then check if early buyers are already selling (vault draining >15% = skip). Complements momentum check (growth) with drain check (sell pressure).
pool_quality_sizing = true          # Scale position by pool_score/100: score 98 = full size, score 65 = 65%. Bets more on highest-conviction pools.
check_interval_acceleration = true  # Halve poll interval on 3 consecutive declines

# ── v1.4.0 Builder & SuperBuilder Modes ─────────────────────────────────────────
profit_first_mode = true
profit_first_floor_pct = 25.0       # v1.4.0: Exit rugs at -25% (was -50%)
wallet_target_sol = 0.15            # Target for Growth mode

# ── v1.4.0 Risk Breakers ────────────────────────────────────────────────────────
ath_drawdown_pct = 20.0             # Halt if wallet drops 20% from session ATH (complements max_drawdown: ATH guard fires during rallies, drawdown guard fires from session start)
grief_loss_window_secs = 300
grief_loss_limit_sol = 0.03         # Halt if 0.03 SOL lost in 5 min window (= ~3 max-loss trades in a streak — prevents runaway loss spirals)

# ── Multi-RPC Failover ──────────────────────────────────────────────────────────
# Was empty, which made the primary endpoint a single point of failure. On 2026-08-05
# a 60-second window logged 12 "RPC unavailable" filter skips — including 3 Freezable
# and 4 MintRenounce, both of which **fail open**. A skipped Freezable check is how you
# buy a token you cannot sell. The same RPC stalls timed out `executor.execute()` at 8s
# on all three buy attempts, which is the buy failure in the trade log.
#
# multi_rpc.rs ranks these by latency and rotates, so a slow primary degrades instead of
# failing. Public endpoints below are rate-limited — replace with keyed providers
# (Helius/Triton/QuickNode) before running size.
extra_rpc_endpoints = [
    "https://api.mainnet-beta.solana.com",
    "https://solana-rpc.publicnode.com",
    "https://rpc.ankr.com/solana",
]

# v1.4.0: Tiered partial TP ladder (currently disabled for 500% full-exit strategy)
# When enabled, these levels lock in profits incrementally:
# [[sniper.tiered_partial_tp_levels]]
# trigger_pct = 100.0
# sell_pct = 15.0
# [[sniper.tiered_partial_tp_levels]]
# trigger_pct = 300.0
# sell_pct = 20.0
# [[sniper.tiered_partial_tp_levels]]
# trigger_pct = 600.0
# sell_pct = 25.0
tiered_partial_tp = false         # Set true to enable tiered ladder above

# v1.6.0: Dead-zone exit reduced 45→30s (winners exit in <6s, recycle capital faster)
no_pump_timeout_secs = 15        # Faster capital recycling — 15s is still generous for a real runner (best wins exit in <3s)
no_pump_min_gain_pct = 8.0          # Require 8%+ gain to suppress timeout (was 5%). Real runners hit 8% in seconds; marginal pools that tick +5% then fade now get killed.
peak_stagnation_secs = 300          # Exit if peak hasn't improved in 300s (5 min). Raised 90→300: genuine runners consolidate between legs; don't exit during consolidation
peak_stagnation_min_pnl_pct = 175.0 # Only fire stagnation exit when up 175%+ (at or above initial TP). Below 175% is pure SL/timeout territory; above 175% = escalated position that's truly stalling

# v1.5.2: Protect fresh positions from dump-mode force-sell
min_dump_hold_secs = 90             # Positions younger than 90s held through normal TP/SL
copy_wallets = []              # Wallet addresses to copy-trade (buy same tokens they buy)

[sniper.filters]
check_interval_ms = 1000
check_duration_ms = 12000
consecutive_matches = 1
check_mint_renounced = true         # v1.6.0: Re-enabled with social enrichment
check_freezable = true
check_burned = true
check_mutable = true
check_socials = false               # v1.6.0: Set true to hard-reject tokens with zero social links
                                    # Social enrichment now reads Metaplex + off-chain URI
                                    # Scorer applies −4 to +10 boost based on social count
filter_cache_ttl_secs = 30          # Cache filter results per pool
min_pool_size = 10.0          # Loosened from 20 (which rejected ~60% of pools — PoolSize was the #1 rejection). 20 SOL floor only let established/post-pump pools through, reinforcing parabolic-peak entries.
max_pool_size = 150.0         # Raised from 100 — 105-147 SOL pools were scoring 99.9 but being blocked
check_name = true             # v1.2.0: Enabled — zero-cost scam-word filter
check_volume = true           # v1.2.0: Require recent transaction activity
min_volume_txns = 1           # Minimum transactions — 1 lets ultra-fresh pools through
check_liquidity_depth = true      # Check price impact before buying
max_price_impact_pct = 6.0        # 6% max price impact — v1.2.0 baseline was 3.5%; 6% gives room for thin pools without accepting brutal slippage

# v1.2.0: Holder concentration check
check_holder_concentration = false  # Disabled: top-10 on new pools always includes the pool vault (near 100%); false signal
max_top10_holder_pct = 99.0

# v1.1.0: Liquidity momentum check
check_liquidity_momentum = false  # Disabled: Prevents false-rejecting consolidating runners

# v1.1.0: Cross-pool correlation check
# Re-enabled after key fix (was using Raydium program ID; now uses base_mint correctly)
check_cross_pool_correlation = true

# v1.2.0: Deployer rug history check
max_deployer_rugs_24h = 2         # Block deployers with >2 rugs in 24h

# v1.5.2: Deployer wallet age disabled by default (pump.fun uses fresh wallets)
# Reputation scoring provides better deployer-quality signal
check_deployer_wallet_age = false
deployer_min_age_hours = 24         # Only used if check_deployer_wallet_age = true

# ============================================================
# Rate Modes: 7 Trading Profiles
# ============================================================
# Each mode defines: entry size (SOL), take-profit %, stop-loss %
# Switch between modes LIVE on the dashboard: [1]=Micro, [2]=Bearish, [3]=Safe, [4]=Balanced, [5]=Aggressive, [6]=Degen, [7]=Moon
# Dashboard reads the active mode and applies the corresponding parameters immediately (no restart needed).
#
# Phase 1 Optimization Context:
# - Entry size 0.01 SOL is the "sweet spot" (40% win rate from 521 trades)
# - Smaller entries (0.001–0.005) get sandwiched: 25% win rate
# - Larger entries (0.012+) hit slippage: 30% win rate
# - Each mode scales around the sweet spot based on risk appetite
#
# Recommended starting points:
# - New traders: [3] Safe (0.005 SOL, conservative)
# - Standard running: [4] Balanced (0.01 SOL, proven)
# - Aggressive days: [5] Aggressive (0.02 SOL, for momentum)
# - Emergency: [6] Degen (0.04 SOL, last-resort capital push)
# - Pursuit: [7] Moon (0.1 SOL, chasing a banger)

# Micro mode: smallest entry, maximum risk aversion
# Use when: testing, low SOL balance (<0.15 SOL), or ultra-bearish market
# Position sizing: ~1k tokens on fresh pools, 1-2 trades before reload
[[sniper.rate_modes]]
name = "Micro"
order = 1
quote_amount = 0.005       # Raised from 0.001 — full-data analysis: entries <0.004 SOL are NET NEGATIVE (-0.0385 SOL over 148 trades; fees+spread eat them). 0.005 is the smallest size with positive expectancy.
wallet_pct = 0.3           # 0.3% of wallet per trade
take_profit_pct = 50.0     # Exit goal: 50% profit
stop_loss_pct = 8.0        # Exit pain: 8% loss
momentum_max_escalations = 3
enabled = true

# Bearish mode: defensive entry, tight stop
# Use when: market showing weakness, awaiting reversal, or preserving capital
# Position sizing: 2-3k tokens
[[sniper.rate_modes]]
name = "Bearish"
order = 2
quote_amount = 0.003       # Entry: 3 milliSOL (fallback)
wallet_pct = 0.5           # 0.5% of wallet per trade
take_profit_pct = 75.0     # Exit goal: 75% profit
stop_loss_pct = 10.0       # Exit pain: 10% loss
momentum_max_escalations = 6
enabled = true

# Safe mode: conservative entry, baseline risk
# Use when: steady market conditions, testing new filters, or learning
# Position sizing: 5-7k tokens
[[sniper.rate_modes]]
name = "Safe"
order = 3
quote_amount = 0.005       # Entry: 5 milliSOL (fallback)
wallet_pct = 0.8           # 0.8% of wallet per trade
take_profit_pct = 100.0    # Exit goal: 100% profit (double entry)
stop_loss_pct = 12.0       # Exit pain: 12% loss
momentum_max_escalations = 8
enabled = true

# Balanced mode: sweet-spot entry (Phase 1 optimized)
# Use when: normal conditions, or as the baseline mode
# Position sizing: 10-15k tokens (proven winner from data)
# Data: 40% win rate, +57.4% average PnL on 0.01 SOL entries
[[sniper.rate_modes]]
name = "Balanced"
order = 4
quote_amount = 0.01        # Entry: 10 milliSOL (fallback)
wallet_pct = 1.5           # 1.5% of wallet per trade (SWEET SPOT!)
take_profit_pct = 175.0    # Exit goal: 175% profit (escalator starting point)
stop_loss_pct = 12.0       # Exit pain: 12% loss
momentum_max_escalations = 6   # Capped from 12. 12 chased a ~1125x fantasy target a post-pump entry never reaches → rode the reversal down. 6 (~33x ceiling) still captures genuine mega-runners but takes profit instead of chasing top-and-back.
enabled = true

# Aggressive mode: 2× entry, accepting more volatility
# Use when: clear bull signal, pool quality excellent, or after winning streak
# Position sizing: 20-30k tokens
[[sniper.rate_modes]]
name = "Aggressive"
order = 5
quote_amount = 0.02        # Entry: 20 milliSOL (fallback)
wallet_pct = 3.0           # 3% of wallet per trade
take_profit_pct = 300.0    # Exit goal: 300% profit
stop_loss_pct = 15.0       # Exit pain: 15% loss
momentum_max_escalations = 12  # 12-round ladder: 300→540→972→1749→3149→5668→10203→18365→33057→59503→107105→192789% (~1928x)
enabled = true

# Degen mode: 4× entry, maximum conviction
# Use when: exceptional pool signals, wallet at target, or capitalization blitz
# Position sizing: 40-60k tokens
# WARNING: Losses are amplified 4×
[[sniper.rate_modes]]
name = "Degen"
order = 6
quote_amount = 0.04        # Entry: 40 milliSOL (fallback)
wallet_pct = 6.0           # 6% of wallet per trade
take_profit_pct = 450.0    # Exit goal: 450% profit
stop_loss_pct = 25.0       # Exit pain: 25% loss (wider for volatility)
momentum_max_escalations = 12  # 12-round ladder: 450→810→1458→2624→4724→8503→15305→27549→49589→89260→160668→289202% (~2892x)
enabled = true

# Moon mode: maximum bet, chasing 10×+ runners
# Use when: pursuing a known banger, wallet at 3 SOL target, or moon-mode enabled
# Position sizing: 100+ milliSOL (can be entire wallet on confirmed pump)
[[sniper.rate_modes]]
name = "Moon"
order = 7
quote_amount = 0.1          # Entry: 100 milliSOL (fallback)
wallet_pct = 12.0           # 12% of wallet per trade — max conviction
take_profit_pct = 100000.0  # Exit goal: 1000× (99900% gain) — ride parabolic pumps
stop_loss_pct = 60.0        # Exit pain: 60% loss (wide; escalation ladder protects)
momentum_max_escalations = 12   # 12-round ladder: 100000→200000→400000% ...
enabled = true

# Active rate mode (set to one of the above names)
# This is what the dashboard reads. Change it here OR use dashboard hotkeys [1–7]
active_mode_name = "Safe"       # Live override degen caused drawdown flips; restart in capital-preserving mode.

# ============================================================
# Arbitrage Configuration
# ============================================================
[arb]
