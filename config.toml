ws_endpoint = "wss://mainnet.helius-rpc.com/?api-key=b1d54eff-a0db-4e72-84da-61def55d5d55"
commitment = "confirmed"

[wallet]
keypair_path = "C:\\Users\\deads\\.config\\solana\\id.json"

# ===========0=================================================
# Sniper Configuration
# ============================================================
[sniper]
enabled = true
quote_mint = "WSOL"       # WSOL or USDC
quote_amount = 0.01       # Base amount per snipe (in SOL) — scaled by rate mode multiplier
buy_delay_ms = 0
max_buy_retries = 3
max_sell_retries = 5       # extra retries — thin pools need more attempts
auto_sell = true
auto_sell_delay_ms = 0
take_profit_pct = 500.0   # Full exit target: 5x (500%). Tiered partials de-risk
                          # at 100% and 250% before this final exit fires.
stop_loss_pct = 8.0       # Sell when down 8% — data: losses that hit 15% never recovered (median exit -90%)
buy_slippage_pct = 1.0
sell_slippage_pct = 50.0   # wide slippage — pump.fun pools move 30–60% between
                           # estimated_out computation and tx landing. 20% was
                           # getting dropped by leader before the 0x26 fallback
                           # could trigger.
price_check_interval_ms = 1000    # check price every 1s (was 2s) — catches TP/SL 2x faster
price_check_duration_ms = 180000  # 3 min monitor window (was 5 min) — force-sell sooner
one_token_at_a_time = true
use_snipe_list = false
snipe_list_path = "snipe-list.txt"
max_buys = 10              # Auto-activate sell mode after 10 successful buys; 0 = unlimited
trailing_stop_loss_pct = 5.0   # Trail stop 5% below peak price — tighter lock-in on runners
partial_tp_pct = 50.0          # Sell 50% of position at partial TP trigger
partial_tp_trigger = 40.0      # Trigger partial TP when up 40% — secure earlier on 50-200% movers
max_concurrent_positions = 5   # Max open positions at once (0 = unlimited)
cooldown_after_losses = 3      # Pause buying after 3 consecutive losses
cooldown_minutes = 20          # Cooldown duration in minutes
daily_loss_limit_sol = 0.05    # Halt if daily losses exceed 0.05 SOL
max_drawdown_pct = 30.0        # Halt if wallet drops 30% below session start
blacklist_path = "blacklist.txt"

# ── Live-data tuning (v1.5.3) ──────────────────────────────────────────────
# Pool quality: only buy score≥98 pools. Live data (834 trades) shows:
#   score=88 pools correlated with the loss bucket (median exit -40% to -90%)
#   score=98 pools = ultra-fresh (0–7 s) + 15–28 SOL sweet spot — all wins came from here
# Raising threshold eliminates the bulk of losing trades at the cost of fewer entries.
min_pool_score = 98

# Tiered partial TP ladder: de-risk at 100% and 250%, hold remainder to 500%.
#   Level 1 (+100%): sell 25% of position — lock a base 1× return, stop moves to breakeven
#   Level 2 (+250%): sell 25% of remaining 75% — lock another layer while runner runs
#   Full TP (500%): exit remaining ~56% at 5x target
# Format: [[trigger_pct, sell_pct_of_remaining], ...]
tiered_partial_tp_levels = [[100.0, 25.0], [250.0, 25.0]]

# Dead-zone exit: all wins exited within 6 s; 144 losses occurred in the 30–120 s window.
# Cutting to 10 s exits the dead-zone before the loss accumulates with zero impact on winners.
no_pump_timeout_secs = 10

# Protect positions < 90 s from dump mode force-sell (min_out=0). Overnight data
# showed dump mode destroying a 61-second position at -60%. sell_mode still clears
# immediately (dump_mode-only respects this hold floor).
min_dump_hold_secs = 90
copy_wallets = []              # Wallet addresses to copy-trade (buy same tokens they buy)

[sniper.filters]
check_interval_ms = 1000   # poll filters every 1s (was 2s)
check_duration_ms = 12000  # filter window 12s (was 20s) — accept good pools faster
consecutive_matches = 1    # one confirmed pass is enough with all filters enabled
check_mint_renounced = false  # Disabled: many pump.fun graduates haven't renounced
                              # at the moment the WS programNotification fires —
                              # the renounce tx is still in flight. Keeping this on
                              # rejects 30–40% of legitimate fresh launches.
check_freezable = true        # KEEP — freeze authority is a real honeypot signal
check_burned = true           # KEEP — pool vault being non-empty is the real rug check
check_mutable = true          # Metadata mutability check (cheap, keep)
check_socials = false
min_pool_size = 0.3           # Minimum pool SOL liquidity. Fresh pump.fun graduates
                              # land at 0.4–3 SOL, so 5 was rejecting all of them.
                              # 0.3 lets micro-cap snipes through while still cutting
                              # the truly-dead pools that come back to life.
max_pool_size = 0.0           # 0 = disabled
check_name = false            # Disabled: common substrings like "test"/"moon"/"fair
                              # launch" generate too many false positives on real
                              # memecoin names. Re-enable if your snipe list is
                              # specifically curated against scam-word patterns.
check_volume = false       # Require recent transaction activity (off by default)
min_volume_txns = 3        # Minimum transactions in last 60s
check_liquidity_depth = true      # Check price impact before buying
max_price_impact_pct = 5.0        # Reject if our buy causes >5% price impact

# Holder concentration: fresh memecoins consistently have >80% top-10 concentration
# in their first minutes (dev + early buyers). 70% cap was killing every pool.
# Disabled here; re-enable with a high cap (e.g. 95%) if you want it as a softer guard.
check_holder_concentration = false
max_top10_holder_pct = 95.0

# Deployer wallet age: disabled — pump.fun ALWAYS creates fresh deployer wallets
# (0 hours old). The 24h default was rejecting 100% of pump.fun pools at the
# current session start. Reputation scoring (scematica-deployer-reputation.json)
# provides deployer-quality signal without the false-positive problem.
check_deployer_wallet_age = false

# ============================================================
# Arbitrage Configuration
# ============================================================
[arb]
enabled = true
start_mint = "WSOL"
start_amount = 0.005      # Starting capital in SOL (use WSOL for arb)
min_profit_lamports = 10000
max_hops = 3
dexes = ["Raydium", "Orca", "Meteora"]
pool_dir = "pools"
amount_levels = 4         # Try 4 sizes: 100, 50, 25, 12.5 USDC

# ============================================================
# Execution Configuration
# ============================================================
[execution]
executor = "default"      # default | jito
custom_fee_sol = 0.001
compute_unit_limit = 400000
compute_unit_price = 200000  # higher priority fee — faster block inclusion
skip_preflight = true
jito_url = "https://mainnet.block-engine.jito.wtf"

# ============================================================
# Alert / Notification Configuration
# ============================================================
[alerts]
telegram_bot_token = ""        # Set to enable Telegram alerts
telegram_chat_id = ""
discord_webhook_url = ""       # Set to enable Discord alerts
desktop_notifications = true   # Windows toast notifications on buy/sell
