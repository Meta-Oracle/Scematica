[package]
name = "scemadex-integrations"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Bot-side ScemaDEX integrations (x402-settled bond engine) — not published; depends on proprietary Scematica crates."
publish = false

[dependencies]
scemadex-sdk = { path = "../scemadex-sdk" }
scematica-protocol = { path = "../scematica-protocol" }
scematica-executor = { path = "../scematica-executor" }
scematica-nn = { path = "../scematica-nn" }
solana-sdk = { workspace = true }
solana-client = { workspace = true }
solana-transaction-status = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }

[features]
# Opt-in integration tests that hit the live Jupiter aggregator over the network.
# Excluded from the default test run and from CI: enable explicitly with
#   cargo test -p scemadex-integrations --features live-tests
live-tests = []

[dev-dependencies]
tokio = { workspace = true }
scemadex-sdk = { path = "../scemadex-sdk" }
solana-account-decoder = { workspace = true }
