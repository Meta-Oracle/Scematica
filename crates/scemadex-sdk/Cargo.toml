[package]
name = "scemadex-sdk"
version = "0.3.1"
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "ScemaDEX — an agentic liquidity layer: intent-based, RL-routed, x402-metered swap execution with bonded (slashable) fills and a peer marketplace where agents trade inference and experience."
keywords = ["solana", "dex", "defi", "x402"]
categories = ["cryptography::cryptocurrencies"]
readme = "README.md"
documentation = "https://docs.rs/scemadex-sdk"
repository = "https://github.com/Meta-Oracle/Scematica"
homepage = "https://github.com/Meta-Oracle/Scematica"

[[bin]]
name = "scemadex"
path = "src/bin/scemadex.rs"
# Only built when the `cli` feature (a default) is on, so library-only consumers
# that opt out with `default-features = false` never compile the TUI stack.
required-features = ["cli"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
bs58 = { workspace = true }
# SHA-256 for the zkML-verified bond commitments (Merkle model commitment +
# inference attestation). Pure-Rust, no solana-sdk / zeroize conflicts.
sha2 = { workspace = true }

# Optional: the real Scematica Deep Q* agent as the RoutePolicy. Light, publishable
# (no solana-sdk). Pinned by version so the crate can publish; path wins in-workspace.
scematica-nn = { version = "1.27.0", path = "../scematica-nn", optional = true, default-features = false }
# Optional: HTTP transport for the `ai` (LLM) and `net` (peer mesh) features.
reqwest = { workspace = true, optional = true }

# Optional: the `scemadex` live-viewer binary (the `cli` feature). A self-contained
# ratatui TUI driving the lean core's bond engine + peer market — no solana-sdk.
ratatui = { workspace = true, optional = true }
crossterm = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }

# Optional: a REAL zk-SNARK backend (the `snark` feature) — arkworks Groth16 over
# BN254. Pure Rust, in-process setup/prove/verify (no RISC-V guest toolchain), so
# it runs under `cargo test`. Pinned to the 0.4 line: stable `ark-relations` R1CS
# API (0.5+ migrated toward gr1cs) and `rand 0.8` matching the workspace. These are
# heavy and DEFAULT-OFF, so the standard `cargo build`/`test` never pulls them and
# there is no chance of a zeroize/rustls clash with the bot's pinned solana stack —
# the conflict only exists if solana + arkworks are unified, which a default build
# never does. Verify this backend with `cargo test -p scemadex-sdk --features snark`.
ark-bn254 = { version = "0.4", optional = true, default-features = false, features = ["curve"] }
ark-groth16 = { version = "0.4", optional = true, default-features = false }
ark-relations = { version = "0.4", optional = true, default-features = false }
ark-r1cs-std = { version = "0.4", optional = true, default-features = false }
ark-ff = { version = "0.4", optional = true, default-features = false }
ark-ec = { version = "0.4", optional = true, default-features = false }
ark-snark = { version = "0.4", optional = true, default-features = false }
ark-serialize = { version = "0.4", optional = true, default-features = false }
ark-std = { version = "0.4", optional = true, default-features = false }

[features]
# `cli` is on by default so `cargo install scemadex-sdk` yields a runnable
# `scemadex` viewer out of the box. Library embedders who want the lean trait
# surface only should depend with `default-features = false`.
default = ["cli"]
# The `scemadex` terminal live-viewer binary (ratatui TUI over the lean core).
cli = ["dep:ratatui", "dep:crossterm", "dep:tokio", "dep:rand", "dep:anyhow"]
# Use the real Deep Q* agent as the routing policy; its value head supplies the
# conviction that sizes Conviction-Routing bonds.
scematica = ["dep:scematica-nn"]
# Natural-language intent parsing + route/bond narration via an OpenAI-compatible
# LLM endpoint.
ai = ["dep:reqwest"]
# Networked PeerMarket client (RemotePeerMarket) over an HTTP/JSON relay.
net = ["dep:reqwest"]
# A real zk-SNARK proof-of-inference backend (arkworks Groth16 / BN254) behind the
# same `InferenceProof` role as the transparent `zkbackend`. Default-off (heavy dep
# tree). See `src/zksnark.rs` and `examples/snark_settlement.rs`.
snark = [
    "dep:ark-bn254", "dep:ark-groth16", "dep:ark-relations", "dep:ark-r1cs-std",
    "dep:ark-ff", "dep:ark-ec", "dep:ark-snark", "dep:ark-serialize", "dep:ark-std",
    "dep:rand",
]

[[example]]
name = "snark_settlement"
required-features = ["snark"]

[dev-dependencies]
tokio = { workspace = true }

# Build docs.rs with every feature so the `scematica` / `ai` / `net` modules (the
# "injected power" story) render, with feature badges via #[doc(cfg(...))].
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
