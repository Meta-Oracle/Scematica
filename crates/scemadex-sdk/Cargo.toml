[package]
name = "scemadex-sdk"
version = "0.2.1"
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "ScemaDEX — an agentic liquidity layer: intent-based, RL-routed, x402-metered swap execution with bonded (slashable) fills and a peer marketplace where agents trade inference and experience."
keywords = ["solana", "dex", "defi", "x402"]
categories = ["cryptography::cryptocurrencies"]
readme = "README.md"
documentation = "https://docs.rs/scemadex-sdk"
repository = "https://github.com/Meta-Oracle/Scematica"
homepage = "https://github.com/Meta-Oracle/Scematica"

[[bin]]
name = "scemadex"
path = "src/bin/scemadex.rs"
# Only built when the `cli` feature (a default) is on, so library-only consumers
# that opt out with `default-features = false` never compile the TUI stack.
required-features = ["cli"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
bs58 = { workspace = true }
# SHA-256 for the zkML-verified bond commitments (Merkle model commitment +
# inference attestation). Pure-Rust, no solana-sdk / zeroize conflicts.
sha2 = { workspace = true }

# Optional: the real Scematica Deep Q* agent as the RoutePolicy. Light, publishable
# (no solana-sdk). Pinned by version so the crate can publish; path wins in-workspace.
scematica-nn = { version = "1.11.0", path = "../scematica-nn", optional = true, default-features = false }
# Optional: HTTP transport for the `ai` (LLM) and `net` (peer mesh) features.
reqwest = { workspace = true, optional = true }

# Optional: the `scemadex` live-viewer binary (the `cli` feature). A self-contained
# ratatui TUI driving the lean core's bond engine + peer market — no solana-sdk.
ratatui = { workspace = true, optional = true }
crossterm = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }

[features]
# `cli` is on by default so `cargo install scemadex-sdk` yields a runnable
# `scemadex` viewer out of the box. Library embedders who want the lean trait
# surface only should depend with `default-features = false`.
default = ["cli"]
# The `scemadex` terminal live-viewer binary (ratatui TUI over the lean core).
cli = ["dep:ratatui", "dep:crossterm", "dep:tokio", "dep:rand", "dep:anyhow"]
# Use the real Deep Q* agent as the routing policy; its value head supplies the
# conviction that sizes Conviction-Routing bonds.
scematica = ["dep:scematica-nn"]
# Natural-language intent parsing + route/bond narration via an OpenAI-compatible
# LLM endpoint.
ai = ["dep:reqwest"]
# Networked PeerMarket client (RemotePeerMarket) over an HTTP/JSON relay.
net = ["dep:reqwest"]

[dev-dependencies]
tokio = { workspace = true }

# Build docs.rs with every feature so the `scematica` / `ai` / `net` modules (the
# "injected power" story) render, with feature badges via #[doc(cfg(...))].
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
