[package]
name = "scematica-api"
version.workspace = true
edition.workspace = true

[[bin]]
name = "api"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
# FCM push delivery (HTTP v1 via service account, with a legacy server-key fallback).
# rustls (no openssl); this crate has no solana-sdk in its tree, so reqwest 0.11 +
# rustls 0.21 is conflict-free here.
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
# RS256 JWT signing for the FCM HTTP v1 service-account OAuth2 exchange.
jsonwebtoken = "9"
# Cognitive gating for /api/sentience. Pure computation — no solana-sdk, no network,
# nothing that can widen this crate's dependency tree.
scematica-sentience = { version = "1.25.0", path = "../scematica-sentience" }
# Topology collection for /api/mesh. Reads the same state files this crate already serves
# individually, and turns them into a graph. Pure file reads — no network, no solana-sdk.
scematica-mesh = { version = "1.25.0", path = "../scematica-mesh" }
