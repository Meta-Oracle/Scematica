[package]
name = "scematica-sniper"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "New-pool sniper engine for Scematica â€” Raydium AMM V4 listener, filter pipeline, executor, risk breakers."
keywords = ["solana", "trading", "sniper", "defi", "bot"]
categories = ["cryptography::cryptocurrencies", "command-line-utilities"]
readme = "README.md"
repository = "https://github.com/Meta-Oracle/Scematica"
homepage = "https://github.com/Meta-Oracle/Scematica"

[[bin]]
name = "sniper"
path = "src/main.rs"

[[bin]]
name = "backtest"
path = "src/bin/backtest.rs"

[dependencies]
scematica-core = { version = "1.27.0", path = "../scematica-core" }
# Coherence breaker (src/coherence.rs) — shares one definition of Ψ with the API's
# /api/sentience gate. Pure computation: serde/chrono/uuid only, no solana-sdk, no
# network, so it cannot widen this crate's dependency tree.
scematica-sentience = { version = "1.27.0", path = "../scematica-sentience" }
scematica-ai = { version = "1.27.0", path = "../scematica-ai" }
scematica-executor = { version = "1.27.0", path = "../scematica-executor" }
scematica-nn = { version = "1.27.0", path = "../scematica-nn", default-features = false }

solana-sdk.workspace = true
solana-client.workspace = true
solana-account-decoder.workspace = true
spl-token.workspace = true
spl-associated-token-account.workspace = true

tokio.workspace = true
futures.workspace = true

serde.workspace = true
serde_json.workspace = true

tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
anyhow.workspace = true
thiserror.workspace = true

rust_decimal.workspace = true
num-traits.workspace = true

