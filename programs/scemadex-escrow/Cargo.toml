[package]
name = "scemadex-escrow"
version = "0.1.0"
edition = "2021"
authors = ["Scematica Team"]
license = "MIT"
description = "On-chain optimistic bond escrow for ScemaDEX Conviction Routing: trustless custody of a bond through Escrowed → Provisional → Disputed → Finalized, with a four-way slash split. Mirrors scemadex-sdk's settlement state machine."

[lib]
crate-type = ["cdylib", "lib"]
name = "scemadex_escrow"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.29", features = ["init-if-needed"] }
anchor-spl = "0.29"
solana-program = "1.18"

[dev-dependencies]
anchor-client = "0.29"
