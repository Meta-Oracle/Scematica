[package]
name = "scematica-swap"
version = "0.1.0"
edition = "2021"
# The SBF toolchain in solana-cli 1.18.26 (platform-tools v1.41) is rustc 1.75. Declaring
# it lets the host cargo's MSRV-aware resolver pick dependency versions that actually
# compile there — without it, a modern cargo resolves crates needing rustc >= 1.80 and
# the build fails deep in a transitive dep. See DEPLOY_DEVNET.md.
rust-version = "1.75"
authors = ["Scematica Team"]
license = "MIT"
description = "On-chain atomic swap program for Scematica arbitrage"

[lib]
crate-type = ["cdylib", "lib"]
name = "scematica_swap"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.29", features = ["init-if-needed"] }
anchor-spl = "0.29"
solana-program = "1.18"

[dev-dependencies]
anchor-client = "0.29"
