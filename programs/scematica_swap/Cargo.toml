[package]
name = "scematica_swap"
version = "0.2.0"
edition = "2021"
authors = ["Scematica Team"]
license = "MIT"
description = "On-chain atomic swap program for Scematica arbitrage"

[lib]
crate-type = ["cdylib", "lib"]
name = "scematica_swap"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
anchor-spl = "0.32.1"

[dev-dependencies]
anchor-client = "0.32.1"
