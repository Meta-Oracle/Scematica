[workspace]
members = ["crates/mesh-core", "crates/mesh-runtime", "crates/mesh-attest"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

# ── Why this is its own workspace ─────────────────────────────────────────────
#
# Same reason as `scema-botchain`: the root workspace is pinned around `solana-sdk`
# (reqwest 0.11 / curve25519-dalek 3), and anything reaching for a modern EVM or crypto
# stack cannot share that lockfile. This tree also has a second, stronger reason to stay
# separate — it must stay **dependency-minimal on purpose**. The inference path is a
# specification other people are expected to reimplement; every dependency it acquires is
# something a reimplementer has to match.
#
# Rule: nothing in the deterministic path may pull a crate that does floating-point math.

[workspace.dependencies]
tiny-keccak = { version = "2", features = ["keccak"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
