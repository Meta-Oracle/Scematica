name = "scema"
version = "1.0.0"
defaultTargets = ["Scema", "Audit", "formalize"]

# No Mathlib, deliberately.
#
# Not to be clever — because every theorem in this package is meant to be checkable by
# somebody who cloned the repository and ran one command, offline, in seconds. Mathlib is a
# multi-gigabyte dependency and a long build, and a proof nobody can afford to re-check is
# in the same category as a test nobody runs.
#
# It is also a real constraint on what can be stated, and that constraint is healthy: it
# forces the invariants to be elementary. Every result here is about lists, options, integers
# and an inductive tree. If a claim needs measure theory, it is not a claim about a wire
# format.

[[lean_lib]]
name = "Scema"

# The security-audit model: `Audit.lean` plus `Audit/`.
#
# A second library rather than a second package, so there is one toolchain, one `lake
# build`, and the no-Mathlib rule above covers it too — which it can, because every
# module in `Audit/` imports nothing at all.
[[lean_lib]]
name = "Audit"

[[lean_exe]]
name = "formalize"
root = "Main"
