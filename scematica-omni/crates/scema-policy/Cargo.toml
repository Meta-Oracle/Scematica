[package]
name = "scema-policy"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "Scematica Omni — the policy layer: risk-adjusted utility over projections, with pluggable evaluators that may decline rather than guess."
keywords = ["agent", "policy", "utility", "rl"]
categories = ["algorithms"]

[lib]
name = "scema_policy"
path = "src/lib.rs"

[dependencies]
scema-world = { workspace = true }
scema-sim = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# The bot's Deep Q* agent, as ONE evaluator among several rather than as the agent
# itself. `default-features = false` drops its ratatui viewer; what is left is
# serde/tracing/chrono/rand/anyhow with no solana-sdk, which is why reaching across
# workspaces here is safe (see the note in the workspace manifest).
# `version` as well as `path` is required to publish: a path-only dependency cannot be
# resolved by anyone who installs this from the registry. In-workspace the path wins;
# published, consumers get scematica-nn from crates.io. `default-features = false`
# drops its ratatui viewer, leaving serde/tracing/chrono/rand/anyhow and no solana-sdk.
# `1.25.0` is a CARET requirement (^1.25.0), not a pin, and it is deliberately left at the
# oldest version that carries the API this crate uses rather than tracking the bot
# workspace's current number. That is what lets omni publish *first*: the requirement is
# already satisfiable on crates.io, so a release here never waits behind a bot release,
# and consumers resolve to whatever newer 1.x is available (1.26.0 today, 1.27.0 when the
# current tree ships). Raising the floor to a version that is not yet published makes
# every omni crate below `scema-policy` unpublishable, with an error naming a dependency
# nobody changed — so this line moves only when omni needs an API that the floor lacks,
# and only after that version is live.
scematica-nn = { version = "1.25.0", path = "../../../crates/scematica-nn", default-features = false, optional = true }

[features]
# On by default so `scema policy` lists the evaluator and shows it declining on a
# software world. An evaluator that only exists in one build configuration is one
# nobody finds out is out of domain.
default = ["dqstar"]
dqstar = ["dep:scematica-nn"]
