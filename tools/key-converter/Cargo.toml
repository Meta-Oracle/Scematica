[package]
name = "key-converter"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

# Build tooling for this repository, not a library anybody installs. Marked unpublishable
# rather than merely left out of a release script: `scripts/publish-order.py` derives the
# order from `cargo metadata`, so anything publishable reappears the next time somebody
# regenerates it. `publish = false` is the only form of "no" that survives that.
#
# `key-converter` and `pool-seeder` are also both very generic crates.io names, and claiming
# a name there is permanent.
publish = false

[dependencies]
bip39 = "2.0"
serde_json.workspace = true
anyhow.workspace = true
solana-sdk.workspace = true
