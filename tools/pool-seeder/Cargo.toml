[package]
name = "pool-seeder"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Fetches live pool metadata from Raydium, Orca, and Meteora and writes JSON files for the arb engine"

# Build tooling for this repository, not a library anybody installs. Marked unpublishable
# rather than merely left out of a release script: `scripts/publish-order.py` derives the
# order from `cargo metadata`, so anything publishable reappears the next time somebody
# regenerates it. `publish = false` is the only form of "no" that survives that.
#
# `key-converter` and `pool-seeder` are also both very generic crates.io names, and claiming
# a name there is permanent.
publish = false

[[bin]]
name = "pool-seeder"
path = "src/main.rs"

[dependencies]
tokio.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
