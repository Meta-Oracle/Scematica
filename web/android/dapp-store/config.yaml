# Solana dApp Store publishing config — STARTER.
#
# Run `npx dapp-store init` once to generate the authoritative schema for your installed
# CLI version, then merge these Scematica-specific values in. The app-identifying fields
# (android_package, descriptions, the apk path) are correct as-is; the `address` fields
# are filled in for you by the `dapp-store create publisher|app|release` commands.
#
# See the runbook: docs/mobile-app.md → "Solana dApp Store".

publisher:
  name: Meta-Oracle
  address: PUBLISHER_WALLET_PUBKEY   # the pubkey of your publisher keypair (needs a little mainnet SOL)
  website: https://github.com/Meta-Oracle/Scematica
  email: deadsg235@gmail.com

app:
  name: Scematica
  address: APP_MINT_ADDRESS          # generated by `dapp-store create app`
  android_package: io.scematica.app

release:
  address: RELEASE_MINT_ADDRESS      # generated by `dapp-store create release`
  media:
    - purpose: icon
      uri: ./media/icon.png          # 512x512 (or larger) PNG — provide this
    - purpose: screenshot
      uri: ./media/screenshot-1.png  # phone screenshots — provide these
    - purpose: screenshot
      uri: ./media/screenshot-2.png
  files:
    # Update the version in this path when web/package.json is bumped.
    - purpose: install
      uri: ../app/build/outputs/apk/release/scematica-v1.11.3.apk
  catalog:
    en-US:
      name: Scematica
      short_description: Self-hosted Solana sniper — remote & monitor.
      long_description: >
        Companion remote for your own self-hosted Scematica sniper. Monitor new pools,
        trades, PnL, filter stats and the Deep Q* agent live, and control TP/SL,
        sell/dump/rate modes, high-speed and the kill-switch — all over a token-gated
        connection to an instance you run yourself. Your keys and capital never leave
        your machine; the app is a remote, not the bot.
      new_in_version: Initial release.
      saga_features: ""
      preview_video: ""

solana_mobile_dapp_publisher_portal:
  google_store_package: ""
  testing_instructions: >
    The app opens to a pairing screen. Point it at any running scematica-api instance:
    enter the base URL (e.g. http://<host>:3001) and its SCEMATICA_API_TOKEN, or scan the
    QR from the instance's /pair page. It then shows live sniper state and controls.
